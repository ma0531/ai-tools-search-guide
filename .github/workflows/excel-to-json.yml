# data/ai-tools.xlsx をアップロードすると、自動で data/ai-tools.json に変換します。
name: ExcelからJSONに変換

on:
  push:
    paths:
      - "data/ai-tools.xlsx"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: ExcelをJSONに変換（入力ミスがあればここで止まります）
        run: python scripts/excel_to_json.py
      - name: 変換したJSONを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-tools.json
          if git diff --cached --quiet; then
            echo "JSONに変更はありませんでした"
          else
            git commit -m "ExcelからJSONを自動更新"
            git push
          fi
      - name: サイトの再公開を依頼
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
